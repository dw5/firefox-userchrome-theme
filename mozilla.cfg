// mozilla.cfg - firefox-userchrome-theme
// [firefox-userchrome-theme]
// install location: <firefox install dir>/mozilla.cfg (next to the firefox binary)
// loaded via autoconfig.js (in defaults/pref/) at every startup.
//
// unlike user.js, the functions below are available in this file:
//   defaultPref()  set a default value (user can still override it)
//   lockPref()     set a default value AND lock it (user cannot override)
//   clearPref()    clear a user-set value
// user.js only supports user_pref(), so these directives live here.

// NO GOOGLE https://gitlab.com/librewolf-community/settings/-/blob/librewolf.cfg
// (was Services.prefs.clearUserPref - rewritten as the autoconfig builtin)
clearPref("browser.newtabpage.pinned");

/** [SECTION] NEW TAB PAGE
 * we want NTP to display nothing but the search bar without anything distracting.
 * the three prefs below are just for minimalism and they should be easy to revert for users.
 */
defaultPref("browser.newtabpage.activity-stream.section.highlights.includeDownloads", false);
defaultPref("browser.newtabpage.activity-stream.section.highlights.includeVisited", false);
defaultPref("browser.newtabpage.activity-stream.feeds.topsites", false);
// hide stories and sponsored content from Firefox Home
lockPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);
lockPref("browser.newtabpage.activity-stream.showSponsored", false);
lockPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
// disable telemetry in Firefox Home
lockPref("browser.newtabpage.activity-stream.feeds.telemetry", false);
lockPref("browser.newtabpage.activity-stream.telemetry", false);
// hide stories UI in about:preferences#home, empty highlights list
lockPref("browser.newtabpage.activity-stream.feeds.section.topstories.options", "{\"hidden\":true}");
lockPref("browser.newtabpage.activity-stream.default.sites", "");

/** [SECTION] RECOMMENDED
 * disable all "recommend as you browse" activity.
 */
lockPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.features", false);
lockPref("browser.newtabpage.activity-stream.asrouter.userprefs.cfr.addons", false);

// IN CASE FAILS...
defaultPref("browser.newtabpage.pinned", "");
lockPref("browser.newtabpage.pinned", "");
